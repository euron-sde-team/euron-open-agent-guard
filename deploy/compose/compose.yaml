# ─────────────────────────────────────────────────────────────────────────────
# Euron Open AgentGuard: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
# (scripts/test-db.sh is the one exception: it starts only the data services from here.)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports, all on 127.0.0.1 (override in .env if they clash with something you run):
#   web 5110   mailpit 5125 (SMTP 5126)   egress proxy 5128   api 5130   sandbox 5135
#   postgres 5142   mockai 5150   floci 5166   redis 5179   opa 5181   vault 5182
#
# Networks:
#   default   everything except the sandbox
#   sandbox   internal (no route out): the sandbox, plus the api and the worker that call
#             it on http://sandbox:8080 and the egress proxy that sandboxed code may reach
#             on http://egress:3128 when policy grants it. Docker cannot publish a port of
#             a container that is only on an internal network, so `sandbox-gateway`
#             forwards 127.0.0.1:5135 to it for tests and the sandbox suite.
# ─────────────────────────────────────────────────────────────────────────────
name: agentguard

x-server-build: &server-build
  context: ../../apps/api
  dockerfile: ../../infra/docker/server.Dockerfile
  target: server

x-api-env: &api-env
  # Development mode: the local stack talks to an emulator and links to localhost, both
  # of which the production guards refuse on purpose.
  ENVIRONMENT: development
  AGENTGUARD_CLOUD: local
  LOG_LEVEL: ${AG_LOG_LEVEL:-INFO}
  PORT: "8080"
  DATABASE_URL: postgresql+asyncpg://agentguard:agentguard@postgres:5432/agentguard
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?run `make env` first}
  TOKEN_PEPPER: ${TOKEN_PEPPER:?run `make env` first}
  LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?run `make env` first}
  # Keys: a local key kept outside the database (compose.floci.yaml switches to KMS).
  KEY_MODE: local
  STORAGE: local
  LOCAL_STORAGE_DIR: /data/objects
  COOKIE_SECURE: "false"
  # The web container proxies /api with X-Forwarded-For; trust it on the Compose network.
  # On AWS this is the VPC CIDR.
  FORWARDED_ALLOW_IPS: "*"
  CORS_ORIGINS: http://localhost:${AG_WEB_PORT:-5110},http://127.0.0.1:${AG_WEB_PORT:-5110}
  PUBLIC_URL: http://localhost:${AG_WEB_PORT:-5110}
  # Where agents and SDKs reach the API; also the issuer of agent and decision tokens.
  PUBLIC_API_URL: http://localhost:${AG_API_PORT:-5130}
  SIGNUP_ENABLED: "true"
  # Approval requests, invitations and incident notices land in Mailpit
  # (http://localhost:5125).
  MAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM_ADDRESS: agentguard@agentguard.local
  # External secret stores an organisation may pick per secret. Vault runs in dev mode
  # with KV v2 at secret/; AWS Secrets Manager needs the Floci overlay.
  VAULT_URL: http://vault:8200
  VAULT_TOKEN: ${AG_VAULT_TOKEN:?run `make env` first}
  VAULT_MOUNT: secret
  AWS_SECRETS_ENABLED: "false"
  # Host environment variables a secret of store "env" may reference (comma separated).
  ENV_SECRET_ALLOWLIST: ${AG_ENV_SECRET_ALLOWLIST:-}
  # The unprivileged sandbox on the internal network, and the egress proxy.
  SANDBOX_URL: http://sandbox:8080
  SANDBOX_TOKEN: ${SANDBOX_TOKEN:?run `make env` first}
  EGRESS_URL: http://egress:3128
  EGRESS_LISTEN_PORT: "3128"
  # Optional sidecars: Rego policies (deny overrides native) and TokenShield budgets
  # (the mock on mockai; point it at a real TokenShield to use one).
  OPA_URL: http://opa:8181
  TOKENSHIELD_URL: ${AG_TOKENSHIELD_URL:-http://mockai:5150/tokenshield}
  # stdio MCP servers run a command inside the api container: only these may be
  # registered (comma separated; empty allows none).
  STDIO_ALLOWED_COMMANDS: ${AG_STDIO_ALLOWED_COMMANDS:-}
  # Local demo only: HTTP tools, MCP servers, webhooks and the AI classifier may target
  # this network (the demo tools and MCP servers live on mockai). Production refuses both.
  ALLOW_PRIVATE_URLS: "true"
  AI_ALLOW_PRIVATE_ENDPOINTS: "true"
  # `make demo`: the seeded company's logins and the mock services it is wired to.
  AGENTGUARD_DEMO_PASSWORD: ${AG_DEMO_PASSWORD:-Demo-Pass-2026}
  DEMO_MOCKAI_URL: http://mockai:5150

x-server: &server
  image: agentguard-server:local
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001
  restart: unless-stopped

x-probe: &probe
  interval: 5s
  timeout: 3s
  retries: 30

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: agentguard
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: agentguard
    ports:
      - "127.0.0.1:${AG_PG_PORT:-5142}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard -d agentguard"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Usage counters, rate limits, the kill switch, replay nonces, caches and the live
  # decision feed. noeviction: a counter or a nonce must never be evicted to make room
  # (an evicted limit would reset; AgentGuard fails closed on a refused write instead),
  # matching the ElastiCache parameter group.
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${AG_REDIS_PORT:-5179}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Catches every email the app sends (SMTP 1025, web UI on 5125, SMTP on 5126 for tests).
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${AG_MAILPIT_PORT:-5125}:8025"
      - "127.0.0.1:${AG_SMTP_PORT:-5126}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      <<: *probe
    restart: unless-stopped

  # The optional policy decision point. Organisations that write Rego get it combined
  # deny-overrides with the native engine, so OPA can only add caution. The -debug
  # variant is the same OPA build plus a busybox shell, used only for the healthcheck.
  opa:
    image: openpolicyagent/opa:1.10.0-debug
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "--log-level", "error"]
    ports:
      - "127.0.0.1:${AG_OPA_PORT:-5181}:8181"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8181/health"]
      <<: *probe
    restart: unless-stopped

  # HashiCorp Vault in dev mode (in memory, unsealed, KV v2 at secret/): the external
  # secret store adapter's target. The root token is AG_VAULT_TOKEN from .env.
  vault:
    image: hashicorp/vault:1.21.0
    command: ["server", "-dev"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${AG_VAULT_TOKEN:?run `make env` first}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      # Dev mode keeps everything in memory; no mlock capability is needed.
      SKIP_SETCAP: "true"
      VAULT_DISABLE_MLOCK: "true"
    ports:
      - "127.0.0.1:${AG_VAULT_PORT:-5182}:8200"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health"]
      <<: *probe
    restart: unless-stopped

  # One process with every stand-in the demo and the tests need, with no key and no
  # network: the mock model (injection classifier), a mock OIDC provider, a mock
  # TokenShield, the demo HTTP tools and the demo MCP servers.
  mockai:
    <<: *server
    build: *server-build
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["uvicorn", "mockai.app:app", "--host", "0.0.0.0", "--port", "5150", "--no-access-log"]
    ports:
      - "127.0.0.1:${AG_MOCK_AI_PORT:-5150}:5150"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5150/healthz', timeout=2).status == 200 else 1)"]
      <<: *probe

  # Migrate first: the api, the worker and the egress proxy start only once the schema
  # (including the rules that make the audit log append-only) is in place.
  migrate:
    <<: *server
    command: ["migrate"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *server
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${AG_API_PORT:-5130}:8080"
    volumes:
      - objects:/data/objects
    networks: [default, sandbox]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      <<: *probe
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      opa:
        condition: service_healthy
      vault:
        condition: service_healthy
      mockai:
        condition: service_healthy

  # Background jobs: notifications, approval expiry, execution on approval, MCP discovery
  # and health, behavioural analysis, auto-response, audit checkpoints, retention.
  worker:
    <<: *server
    command: ["worker"]
    environment:
      <<: *api-env
    volumes:
      - objects:/data/objects
    networks: [default, sandbox]
    # The worker serves no HTTP: it is healthy while its metrics endpoint answers.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9464/metrics', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      vault:
        condition: service_healthy

  # The egress guard: an HTTP and CONNECT forward proxy that admits a destination only
  # when the calling agent's network policy allows it, checks the connected peer (no
  # private ranges or metadata addresses, even after DNS rebinding) and records every
  # refusal. It needs the internet (default network) and serves the sandbox network.
  egress:
    <<: *server
    command: ["egress"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${AG_EGRESS_PORT:-5128}:3128"
    networks: [default, sandbox]
    # A forward proxy has no health path of its own: healthy while it accepts connections.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 3128), timeout=2).close()"]
      <<: *probe
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The only place untrusted code runs. Unprivileged: every capability dropped, no new
  # privileges, a read-only root, Docker's default seccomp plus only the namespace
  # syscalls nsjail needs (infra/docker/sandbox-seccomp.json), bounded processes and
  # memory, scratch on tmpfs. Each run gets its own nsjail (user, PID, mount, network,
  # IPC and UTS namespaces) with no network interface unless policy grants the egress
  # proxy. On the internal `sandbox` network only: it can reach the egress proxy and
  # nothing on the internet, the database, Redis or the host.
  sandbox:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/sandbox.Dockerfile
      target: sandbox
    image: agentguard-sandbox:local
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?run `make env` first}
      SANDBOX_HOST: 0.0.0.0
      SANDBOX_PORT: "8080"
      SANDBOX_LOG_LEVEL: ${AG_LOG_LEVEL:-INFO}
      # Two runs at once, each at most 1 GiB, beside the scratch tmpfs: inside mem_limit.
      SANDBOX_CONCURRENCY: "2"
      SANDBOX_MAX_MEMORY_MB: "1024"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=../../infra/docker/sandbox-seccomp.json
    read_only: true
    tmpfs:
      # Per-run working directories (code, input files, the egress socket). Private to
      # the container; tmpfs pages count against mem_limit. The same flags as
      # scripts/test-sandbox.sh, so the hostile suite tests exactly this.
      - /tmp:exec,size=1g,uid=10001,gid=10001,mode=0700
    pids_limit: 512
    mem_limit: 3g
    cpus: 2
    networks: [sandbox]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      <<: *probe
      start_period: 10s
    restart: unless-stopped

  # 127.0.0.1:5135 to the sandbox (see the header): the integration suite and the
  # sandbox suite call it from the host. Every /run still needs SANDBOX_TOKEN.
  sandbox-gateway:
    image: alpine/socat:1.8.0.3
    command: ["TCP-LISTEN:8080,fork,reuseaddr", "TCP:sandbox:8080"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${AG_SANDBOX_PORT:-5135}:8080"
    networks: [default, sandbox]
    healthcheck:
      # Through the forwarder to the sandbox's own probe.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      <<: *probe
    depends_on:
      sandbox:
        condition: service_healthy
    restart: unless-stopped

  # The dashboard. The browser talks to this origin; Next rewrites /api to the api on the
  # Compose network.
  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    image: agentguard-web:local
    environment:
      API_URL: http://api:8080
      API_INTERNAL_URL: http://api:8080
      PORT: "8080"
    ports:
      - "127.0.0.1:${AG_WEB_PORT:-5110}:8080"
    read_only: true
    tmpfs:
      # The node user is uid 1000; Next writes its image cache under .next/cache.
      - /tmp:uid=1000,gid=1000
      - /app/.next/cache:uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      <<: *probe
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
  # No route out of this network: a compromised sandbox reaches the egress proxy (which
  # enforces network policy) and its callers, nothing else.
  sandbox:
    internal: true

volumes:
  pgdata:
  redisdata:
  objects:
