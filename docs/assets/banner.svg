<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Euron Open AgentGuard</title>
  <desc id="d">Euron Open AgentGuard: secure every agent, control every action, trust every execution. A self-hosted security layer that decides every action an AI agent takes before it happens. Illustration of a decision feed where a read is allowed, a refund waits for approval, a delete is denied and an exfiltration attempt is blocked.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1f1a"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <circle cx="1010" cy="160" r="210" fill="url(#halo)"/>

  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="72" y="70" width="44" height="44" rx="12" fill="url(#mark)"/>
    <path d="M94 79l13 5v9c0 8.5-5.6 14.6-13 17.5-7.4-2.9-13-9-13-17.5v-9z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M88.5 93.5l4 4 7.5-8" fill="none" stroke="#047857" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="104" fill="#a7f3d0" font-size="18" font-weight="600" letter-spacing="0.4">EURON OPEN</text>
    <text x="72" y="168" fill="#ecfdf5" font-size="54" font-weight="650" letter-spacing="-1.2">Euron Open AgentGuard</text>
    <text x="74" y="210" fill="#6ee7b7" font-size="21" font-weight="400">Secure every agent. Control every action. Trust every execution.</text>
    <text x="74" y="256" fill="#94a3b8" font-size="16">Self-hosted  ·  policy before every action  ·  human approvals  ·  sealed secrets  ·  MIT</text>
  </g>

  <!-- decision feed illustration -->
  <g filter="url(#shadow)">
    <rect x="850" y="34" width="340" height="252" rx="18" fill="#132320"/>
  </g>
  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="850" y="34" width="340" height="40" rx="18" fill="#1b3a33"/>
    <rect x="850" y="56" width="340" height="18" fill="#1b3a33"/>
    <circle cx="874" cy="54" r="6" fill="#34d399"/>
    <text x="888" y="59" fill="#d1fae5" font-size="14" font-weight="600">Live decisions</text>

    <rect x="866" y="88" width="308" height="38" rx="10" fill="#1e293b"/>
    <text x="880" y="112" fill="#e2e8f0" font-size="12.5">support-agent  crm.get_customer</text>
    <rect x="1112" y="98" width="52" height="18" rx="9" fill="#065f46"/>
    <text x="1138" y="111" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">ALLOW</text>

    <rect x="866" y="134" width="308" height="38" rx="10" fill="#1e293b"/>
    <text x="880" y="158" fill="#e2e8f0" font-size="12.5">finance-agent  refund 1800 EUR</text>
    <rect x="1094" y="144" width="70" height="18" rx="9" fill="#78350f"/>
    <text x="1129" y="157" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">APPROVAL</text>

    <rect x="866" y="180" width="308" height="38" rx="10" fill="#1e293b"/>
    <text x="880" y="204" fill="#e2e8f0" font-size="12.5">finance-agent  ledger_db delete</text>
    <rect x="1118" y="190" width="46" height="18" rx="9" fill="#7f1d1d"/>
    <text x="1141" y="203" fill="#fecaca" font-size="10" font-weight="700" text-anchor="middle">DENY</text>

    <rect x="866" y="226" width="308" height="44" rx="10" fill="#1e293b" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="880" y="245" fill="#e2e8f0" font-size="12.5">research-agent  email.send</text>
    <text x="880" y="262" fill="#94a3b8" font-size="10.5">run tainted by an injected web page</text>
    <rect x="1106" y="238" width="58" height="18" rx="9" fill="#7f1d1d"/>
    <text x="1135" y="251" fill="#fecaca" font-size="10" font-weight="700" text-anchor="middle">BLOCKED</text>
  </g>
</svg>
