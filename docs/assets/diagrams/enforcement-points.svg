<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">AgentGuard enforcement points</title>
  <desc id="d">Four places where AgentGuard stops a denied action. Trusted execution: the agent calls execute, AgentGuard decides, injects the secret, checks the network and scans the result, and a denied action never reaches the tool. Decision tokens: the agent gets a single-use signed token bound to the action hash, and the tool verifies the signature, hash and expiry and redeems it once before acting. MCP gateway: tools the agent can never use are hidden from tools/list and every tools/call goes through the decision pipeline. Egress proxy: agents and sandboxed code connect only through the proxy, which refuses destinations outside the network policy, private ranges and metadata addresses.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#047857"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1200" height="640" rx="16" fill="#f8fafc"/>
  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#0f172a">
    <rect x="30" y="30" width="555" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="54" y="66" font-size="17" font-weight="700">1. Trusted execution</text>
    <text x="561" y="66" font-size="12" fill="#64748b" text-anchor="end">http, mcp and sandbox tools</text>
    <rect x="54" y="100" width="120" height="70" rx="10" fill="#e2e8f0"/>
    <text x="114.0" y="124" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">Agent</text>
    <text x="114.0" y="144" text-anchor="middle" font-size="12" fill="#475569">no tool</text>
    <text x="114.0" y="161" text-anchor="middle" font-size="12" fill="#475569">credentials</text>
    <rect x="230" y="90" width="170" height="190" rx="10" fill="#6ee7b7"/>
    <text x="315.0" y="114" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">AgentGuard</text>
    <text x="315.0" y="134" text-anchor="middle" font-size="12" fill="#064e3b">POST /execute</text>
    <text x="315.0" y="151" text-anchor="middle" font-size="12" fill="#064e3b">decide</text>
    <text x="315.0" y="168" text-anchor="middle" font-size="12" fill="#064e3b">inject secret</text>
    <text x="315.0" y="185" text-anchor="middle" font-size="12" fill="#064e3b">check network</text>
    <text x="315.0" y="202" text-anchor="middle" font-size="12" fill="#064e3b">apply obligations</text>
    <text x="315.0" y="219" text-anchor="middle" font-size="12" fill="#064e3b">scan the result</text>
    <rect x="450" y="100" width="112" height="70" rx="10" fill="#e2e8f0"/>
    <text x="506.0" y="124" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">Tool</text>
    <text x="506.0" y="144" text-anchor="middle" font-size="12" fill="#475569">HTTP, MCP,</text>
    <text x="506.0" y="161" text-anchor="middle" font-size="12" fill="#475569">sandbox</text>
    <path d="M174 130 L 228 130" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a)"/>
    <path d="M400 130 L 448 130" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a)"/>
    <path d="M400 230 L 506 230 L 506 198" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M499 183 L 513 197 M513 183 L 499 197" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
    <text x="414" y="252" font-size="11.5" fill="#b91c1c" text-anchor="start">denied: never called</text>
    <text x="54" y="210" font-size="11.5" fill="#475569" text-anchor="start">The agent cannot reach</text>
    <text x="54" y="226" font-size="11.5" fill="#475569" text-anchor="start">the tool any other way:</text>
    <text x="54" y="242" font-size="11.5" fill="#475569" text-anchor="start">it never holds the key.</text>
    <rect x="615" y="30" width="555" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="639" y="66" font-size="17" font-weight="700">2. Decision tokens</text>
    <text x="1146" y="66" font-size="12" fill="#64748b" text-anchor="end">function tools, your own services</text>
    <rect x="639" y="100" width="120" height="70" rx="10" fill="#e2e8f0"/>
    <text x="699.0" y="124" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">Agent</text>
    <text x="699.0" y="144" text-anchor="middle" font-size="12" fill="#475569">authorize</text>
    <text x="699.0" y="161" text-anchor="middle" font-size="12" fill="#475569">want_token</text>
    <rect x="815" y="90" width="150" height="80" rx="10" fill="#6ee7b7"/>
    <text x="890.0" y="114" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">AgentGuard</text>
    <text x="890.0" y="134" text-anchor="middle" font-size="12" fill="#064e3b">signs agd+jwt:</text>
    <text x="890.0" y="151" text-anchor="middle" font-size="12" fill="#064e3b">hash, 60 s, once</text>
    <rect x="815" y="190" width="330" height="96" rx="10" fill="#d1fae5"/>
    <text x="980.0" y="214" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">Your tool (SDK verifier)</text>
    <text x="980.0" y="234" text-anchor="middle" font-size="12" fill="#064e3b">1. signature against the JWKS, expiry</text>
    <text x="980.0" y="251" text-anchor="middle" font-size="12" fill="#064e3b">2. its own hash of the parameters it got</text>
    <text x="980.0" y="268" text-anchor="middle" font-size="12" fill="#064e3b">3. redeem online: used once, then refused</text>
    <path d="M759 130 L 813 130" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a)"/>
    <path d="M699 170 L 699 238 L 813 238" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a)"/>
    <text x="645" y="262" font-size="11.5" fill="#475569" text-anchor="start">call + X-AgentGuard-Decision</text>
    <path d="M965 130 L 1035 130 L 1035 188" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <text x="1043" y="122" font-size="11.5" fill="#475569" text-anchor="start">redeem</text>
    <rect x="30" y="330" width="555" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="54" y="366" font-size="17" font-weight="700">3. MCP gateway</text>
    <text x="561" y="366" font-size="12" fill="#64748b" text-anchor="end">every registered MCP tool</text>
    <rect x="54" y="400" width="120" height="70" rx="10" fill="#e2e8f0"/>
    <text x="114.0" y="424" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">MCP client</text>
    <text x="114.0" y="444" text-anchor="middle" font-size="12" fill="#475569">one URL,</text>
    <text x="114.0" y="461" text-anchor="middle" font-size="12" fill="#475569">agent token</text>
    <rect x="230" y="390" width="170" height="190" rx="10" fill="#6ee7b7"/>
    <text x="315.0" y="414" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">/mcp</text>
    <text x="315.0" y="434" text-anchor="middle" font-size="12" fill="#064e3b">tools/list: only</text>
    <text x="315.0" y="451" text-anchor="middle" font-size="12" fill="#064e3b">tools it could use</text>
    <text x="315.0" y="468" text-anchor="middle" font-size="12" fill="#064e3b">tools/call: full</text>
    <text x="315.0" y="485" text-anchor="middle" font-size="12" fill="#064e3b">pipeline, then</text>
    <text x="315.0" y="502" text-anchor="middle" font-size="12" fill="#064e3b">trusted execution,</text>
    <text x="315.0" y="519" text-anchor="middle" font-size="12" fill="#064e3b">outputs scanned</text>
    <rect x="450" y="400" width="112" height="70" rx="10" fill="#e2e8f0"/>
    <text x="506.0" y="424" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">MCP servers</text>
    <text x="506.0" y="444" text-anchor="middle" font-size="12" fill="#475569">fingerprinted,</text>
    <text x="506.0" y="461" text-anchor="middle" font-size="12" fill="#475569">reviewed</text>
    <path d="M174 430 L 228 430" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a)"/>
    <path d="M400 430 L 448 430" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a)"/>
    <path d="M400 530 L 506 530 L 506 498" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M499 483 L 513 497 M513 483 L 499 497" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
    <text x="414" y="552" font-size="11.5" fill="#b91c1c" text-anchor="start">hidden or held: refused</text>
    <text x="54" y="510" font-size="11.5" fill="#475569" text-anchor="start">Changed tool definitions</text>
    <text x="54" y="526" font-size="11.5" fill="#475569" text-anchor="start">wait for a person before</text>
    <text x="54" y="542" font-size="11.5" fill="#475569" text-anchor="start">any call goes through.</text>
    <rect x="615" y="330" width="555" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="639" y="366" font-size="17" font-weight="700">4. Egress proxy</text>
    <text x="1146" y="366" font-size="12" fill="#64748b" text-anchor="end">agents' own traffic, sandboxed code</text>
    <rect x="639" y="390" width="120" height="60" rx="10" fill="#e2e8f0"/>
    <text x="699.0" y="414" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">Agent</text>
    <text x="699.0" y="434" text-anchor="middle" font-size="12" fill="#475569">access token</text>
    <rect x="639" y="470" width="120" height="60" rx="10" fill="#e2e8f0"/>
    <text x="699.0" y="494" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">Sandbox run</text>
    <text x="699.0" y="514" text-anchor="middle" font-size="12" fill="#475569">proxy token, relayed</text>
    <rect x="815" y="390" width="170" height="190" rx="10" fill="#047857"/>
    <text x="900.0" y="414" text-anchor="middle" font-size="14" font-weight="650" fill="#ffffff">egress proxy</text>
    <text x="900.0" y="434" text-anchor="middle" font-size="12" fill="#d1fae5">authenticate agent</text>
    <text x="900.0" y="451" text-anchor="middle" font-size="12" fill="#d1fae5">network policy</text>
    <text x="900.0" y="468" text-anchor="middle" font-size="12" fill="#d1fae5">resolve once</text>
    <text x="900.0" y="485" text-anchor="middle" font-size="12" fill="#d1fae5">connect to a</text>
    <text x="900.0" y="502" text-anchor="middle" font-size="12" fill="#d1fae5">checked address</text>
    <text x="900.0" y="519" text-anchor="middle" font-size="12" fill="#d1fae5">record bytes</text>
    <rect x="1035" y="400" width="112" height="70" rx="10" fill="#e2e8f0"/>
    <text x="1091.0" y="424" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">Internet</text>
    <text x="1091.0" y="444" text-anchor="middle" font-size="12" fill="#475569">allowed</text>
    <text x="1091.0" y="461" text-anchor="middle" font-size="12" fill="#475569">destinations</text>
    <path d="M759 420 L 813 420" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a)"/>
    <path d="M759 500 L 813 500" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a)"/>
    <path d="M985 430 L 1033 430" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a)"/>
    <path d="M985 530 L 1091 530 L 1091 498" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M1084 483 L 1098 497 M1098 483 L 1084 497" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
    <text x="999" y="552" font-size="11.5" fill="#b91c1c" text-anchor="start">403: private, metadata,</text>
    <text x="999" y="568" font-size="11.5" fill="#b91c1c" text-anchor="start">not in policy</text>
  </g>
</svg>
