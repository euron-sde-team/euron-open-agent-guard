[project]
name = "euron-agentguard"
version = "0.1.0"
description = "Python SDK for Euron Open AgentGuard: authorize, execute and verify every action an AI agent takes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ENGAGESPHERE TECHNOLOGY PRIVATE LIMITED and the Euron Open AgentGuard contributors" }]
requires-python = ">=3.10"
keywords = ["ai-agents", "security", "authorization", "langgraph", "crewai", "mcp", "policy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
# The core SDK needs only an HTTP client and a JWT library (Ed25519 through cryptography).
dependencies = [
  "httpx>=0.27,<1",
  "pyjwt[crypto]>=2.8,<3",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
langgraph = ["langchain-core>=0.3,<2", "langgraph>=0.2,<2"]
crewai = ["crewai>=0.80"]
mcp = ["mcp>=1.20"]

[project.urls]
Homepage = "https://github.com/euron-sde-team/euron-open-agent-guard"
Documentation = "https://github.com/euron-sde-team/euron-open-agent-guard/blob/main/docs/guides/sdk-python.md"
Issues = "https://github.com/euron-sde-team/euron-open-agent-guard/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.13",
  "fastapi>=0.110",
  "langchain-core>=0.3,<2",
  "langgraph>=0.2,<2",
  "mcp>=1.20",
  "crewai>=0.80",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/euron_agentguard"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311", "E501", "PT011", "PT018", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["crewai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: needs a running AgentGuard API (set AGENTGUARD_URL)",
]
addopts = "-ra"

[tool.coverage.run]
source = ["euron_agentguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
