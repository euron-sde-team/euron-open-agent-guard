name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stack:
    name: full stack on Floci (backend matrix, browser tests, DAST)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Start the stack (Terraform applies local-floci inside compose)
        run: make up
      - name: Seed the demo company
        run: make demo
      - name: Integration suite under every key, secret store and Redis backend
        run: make test-matrix
      - name: Browser end-to-end tests (Chromium)
        run: make e2e
      - name: Browser QA sweep
        run: make qa
      - name: OWASP ZAP API scan
        run: make dast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            scripts/qa/output
            reports/dast
      - name: Logs on failure
        if: failure()
        run: make logs SERVICE= | tail -500
      - if: always()
        run: make down
