name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git --config /repo/.gitleaks.toml --redact --verbose /repo

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  bandit:
    name: bandit (api and sandbox)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Medium severity and confidence and above fail; the mock services are test fixtures.
      - run: uvx bandit==1.8.6 -r src -x src/mockai -ll -ii

  audit-python:
    name: pip-audit (api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The server image installs exactly these locked dependencies.
      - run: uv export --frozen --no-dev --format requirements-txt > requirements.txt
      - run: uvx pip-audit --strict -r requirements.txt

  audit-node:
    name: pnpm audit (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  trivy:
    name: trivy image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: server, context: apps/api, target: server }
          - { image: sandbox, context: apps/api, target: sandbox }
          - { image: web, context: apps/web, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: infra/docker/${{ matrix.image }}.Dockerfile
          target: ${{ matrix.target }}
          load: true
          tags: agentguard-${{ matrix.image }}:scan
      # Fixed, high or critical vulnerabilities in the OS packages or the locked
      # dependencies fail the job.
      - name: trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            agentguard-${{ matrix.image }}:scan
